<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="U-RI8DN4HdTLfstsn08HkW_4vs7oCXjQM2flGhzsh4Y" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGPA Calculator</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>🎓 CGPA Calculator</h1>
    <p class="subtitle">
  Calculate your CGPA instantly for up to 8 semesters
</p>
    <div class="box">

      <label>Select Number of Semesters</label>

      <select id="semesterCount" onchange="generateInputs()">
        <option value="">Choose</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>

      <div id="sgpaInputs"></div>

      <button onclick="calculateCGPA()">
        Calculate CGPA
      </button>

      <h2 id="result">
        CGPA: 0.00
      </h2>
    <hr>

<h3>🎯 Target CGPA Planner</h3>

<input type="number" id="targetCGPA" placeholder="Enter Target CGPA (e.g. 8.5)">

<button onclick="calculateRequiredSGPA()">
  Calculate Required SGPA
</button>

<p id="requiredResult"></p>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
