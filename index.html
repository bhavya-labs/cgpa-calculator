<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CGPA Calculator</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🎓 CGPA Calculator</h1>

    <p class="subtitle">
        Calculate CGPA for any degree using semester credits
    </p>

    <div class="box">

        <label>Total Number of Semesters</label>

        <input
            type="number"
            id="semesterCount"
            min="1"
            max="20"
            placeholder="Enter total semesters"
        >

        <button onclick="generateInputs()">
            Generate Semesters
        </button>

        <div id="semesterInputs"></div>

        <button onclick="calculateCGPA()">
            Calculate CGPA
        </button>

        <h2 id="result">
            CGPA: 0.00
        </h2>

        <hr>

        <h3>🎯 Target CGPA Planner</h3>

        <input
            type="number"
            step="0.01"
            id="targetCGPA"
            placeholder="Enter Target CGPA"
        >

        <button onclick="calculateRequiredCGPA()">
            Calculate Required Performance
        </button>

        <p id="requiredResult"></p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
